overlay: 1.1.0
info:
    title: Drop Automation prefix from generated model type names
    version: 0.0.1
actions:
    - target: $.components.schemas.AutomationAccountSettings
      update:
        x-go-type-name: AccountSettings
    - target: $.components.schemas.AutomationCIBASettings
      update:
        x-go-type-name: CIBASettings
    - target: $.components.schemas.AutomationCertificate
      update:
        x-go-type-name: Certificate
    - target: $.components.schemas.AutomationCertificateSettings
      update:
        x-go-type-name: CertificateSettings
    - target: $.components.schemas.AutomationClientRegistrationSettings
      update:
        x-go-type-name: ClientRegistrationSettings
    - target: $.components.schemas.AutomationDataPlane
      update:
        x-go-type-name: DataPlane
    - target: $.components.schemas.AutomationDomain
      update:
        x-go-type-name: Domain
    - target: $.components.schemas.AutomationIdentityProvider
      update:
        x-go-type-name: IdentityProvider
    - target: $.components.schemas.AutomationOidcSettings
      update:
        x-go-type-name: OidcSettings
    - target: $.components.schemas.AutomationReporter
      update:
        x-go-type-name: Reporter
    - target: $.components.schemas.AutomationSamlSettings
      update:
        x-go-type-name: SamlSettings
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes"].get
      update:
        operationId: listDataPlanes
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes"].put
      update:
        operationId: upsertDataPlane
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}"].get
      update:
        operationId: getDataPlane
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}"].delete
      update:
        operationId: deleteDataPlane
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains"].get
      update:
        operationId: listDomains
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains"].put
      update:
        operationId: upsertDomain
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}"].get
      update:
        operationId: getDomain
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}"].delete
      update:
        operationId: deleteDomain
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates"].get
      update:
        operationId: listCertificates
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates"].put
      update:
        operationId: upsertCertificate
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates/{certKey}"].get
      update:
        operationId: getCertificate
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates/{certKey}"].delete
      update:
        operationId: deleteCertificate
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities"].get
      update:
        operationId: listIdentityProviders
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities"].put
      update:
        operationId: upsertIdentityProvider
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities/{identityKey}"].get
      update:
        operationId: getIdentityProvider
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities/{identityKey}"].delete
      update:
        operationId: deleteIdentityProvider
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters"].get
      update:
        operationId: listReporters
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters"].put
      update:
        operationId: upsertReporter
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}"].get
      update:
        operationId: getReporter
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}"].delete
      update:
        operationId: deleteReporter
    - target: $.servers[0]
      description: Bake org/env into the server so operations drop those path params
      update:
        url: "{baseUrl}/organizations/{orgId}/environments/{envId}"
        description: Organization and environment scoped Automation API
        x-go-name: ScopedServerURL
        variables:
            baseUrl:
                default: http://localhost:8093/automation
            orgId:
                default: DEFAULT
            envId:
                default: DEFAULT
    - target: $.paths
      update:
        /dataplanes: {}
        "/dataplanes/{dataPlaneId}": {}
        /domains: {}
        "/domains/{domainKey}": {}
        "/domains/{domainKey}/certificates": {}
        "/domains/{domainKey}/certificates/{certKey}": {}
        "/domains/{domainKey}/identities": {}
        "/domains/{domainKey}/identities/{identityKey}": {}
        "/domains/{domainKey}/reporters": {}
        "/domains/{domainKey}/reporters/{reporterKey}": {}
    - target: $.paths["/dataplanes"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes"]
    - target: $.paths["/dataplanes/{dataPlaneId}"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}"]
    - target: $.paths["/domains"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains"]
    - target: $.paths["/domains/{domainKey}"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}"]
    - target: $.paths["/domains/{domainKey}/certificates"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates"]
    - target: $.paths["/domains/{domainKey}/certificates/{certKey}"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates/{certKey}"]
    - target: $.paths["/domains/{domainKey}/identities"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities"]
    - target: $.paths["/domains/{domainKey}/identities/{identityKey}"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities/{identityKey}"]
    - target: $.paths["/domains/{domainKey}/reporters"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters"]
    - target: $.paths["/domains/{domainKey}/reporters/{reporterKey}"]
      copy: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}"]
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates/{certKey}"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities/{identityKey}"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters"]
      remove: true
    - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}"]
      remove: true
    - target: $.paths.*.*.parameters[?(@.name=='orgId')]
      remove: true
    - target: $.paths.*.*.parameters[?(@.name=='envId')]
      remove: true
