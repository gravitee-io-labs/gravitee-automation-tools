name: Auto-bump dependents

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]

concurrency:
  group: auto-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Update dependents
        run: |
          UPDATED=""
          for PATTERN in "common/v*" "am/v*"; do
            TAG=$(git tag -l "$PATTERN" --sort=-version:refname | head -1)
            [ -z "$TAG" ] && continue
            COMPONENT="${TAG%%/*}"
            VERSION="${TAG#*/}"
            MODULE="github.com/gravitee-io-labs/gravitee-automation-tools/${COMPONENT}"
            for mod in am apim am-mock-server; do
              [ "$mod" = "$COMPONENT" ] && continue
              if grep -q "$MODULE" "$mod/go.mod"; then
                CURRENT=$(sed -n "s|.*${MODULE} \(v[0-9.]*\).*|\1|p" "$mod/go.mod" | head -1)
                if [ "$CURRENT" != "$VERSION" ]; then
                  (cd "$mod" && go mod edit -require "${MODULE}@${VERSION}" && go mod tidy)
                  UPDATED="${UPDATED} ${mod}"
                fi
              fi
            done
          done
          echo "UPDATED=${UPDATED}" >> "$GITHUB_ENV"

      - name: Create pull request
        if: env.UPDATED != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-bump/deps
          commit-message: "fix(deps): bump internal dependencies"
          title: "fix(deps): bump internal dependencies"
          body: Auto-generated by the auto-bump workflow.
