name: Auto-bump dependents

on:
  push:
    tags:
      - "common/v*"
      - "am/v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Update dependents
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMPONENT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          MODULE="github.com/gravitee-io-labs/gravitee-automation-sdks/${COMPONENT}"
          UPDATED=""
          for mod in am apim common am-mock-server; do
            [ "$mod" = "$COMPONENT" ] && continue
            if grep -q "$MODULE" "$mod/go.mod"; then
              (cd "$mod" && go mod edit -require "${MODULE}@${VERSION}" && go mod tidy)
              UPDATED="${UPDATED} ${mod}"
            fi
          done
          echo "UPDATED=${UPDATED}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "COMPONENT=${COMPONENT}" >> "$GITHUB_ENV"

      - name: Create pull request
        if: env.UPDATED != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-bump/${{ env.COMPONENT }}-${{ env.VERSION }}
          commit-message: "fix(deps): update ${{ env.COMPONENT }} to ${{ env.VERSION }}"
          title: "fix(deps): update ${{ env.COMPONENT }} to ${{ env.VERSION }}"
          body: |
            Auto-generated bump of `${{ env.COMPONENT }}` to `${{ env.VERSION }}` in:${{ env.UPDATED }}
