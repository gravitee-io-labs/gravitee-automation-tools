name: Auto-bump common dependents

on:
  push:
    tags:
      - "common/v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Update dependents
        run: |
          VERSION="${GITHUB_REF_NAME#common/}"
          MODULE="github.com/gravitee-io-labs/gravitee-automation-sdks/common"
          UPDATED=""
          for mod in am apim am-mock-server; do
            if grep -q "$MODULE" "$mod/go.mod"; then
              (cd "$mod" && go mod edit -require "${MODULE}@${VERSION}")
              UPDATED="${UPDATED} ${mod}"
            fi
          done
          echo "UPDATED=${UPDATED}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create pull request
        if: env.UPDATED != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-bump/common-${{ env.VERSION }}
          commit-message: "fix(deps): update common to ${{ env.VERSION }}"
          title: "fix(deps): update common to ${{ env.VERSION }}"
          body: |
            Auto-generated bump of `common` to `${{ env.VERSION }}` in:${{ env.UPDATED }}
