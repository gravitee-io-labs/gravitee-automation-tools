name: Release Binaries

on:
  push:
    tags:
      - "am-mock-server/v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: am-mock-server/go.mod

      - name: Strip tag prefix
        run: echo "VERSION=${GITHUB_REF_NAME#am-mock-server/}" >> "$GITHUB_ENV"

      - name: Create local version tag
        run: git tag "${{ env.VERSION }}"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: am-mock-server
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      - name: Upload artifacts to release
        run: gh release upload "${{ github.ref_name }}" am-mock-server/dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
